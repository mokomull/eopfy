[package]
name = "eopfy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
axum_session = "0.17.1"
handlebars = "6.3.2"
http = "1.3.1"
humantime = "2.3.0"
mime = "0.3.17"
serde = "1.0.228"
serde-xml-rs = "0.8.1"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
uuid = "1.18.1"
virt = "0.4.3"
