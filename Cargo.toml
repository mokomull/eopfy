[package]
name = "eopfy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
axum_session = "0.17.1"
base64 = "0.22.1"
env_logger = "0.11.8"
form_urlencoded = "1.2.2"
handlebars = "6.3.2"
http = "1.3.1"
humantime = "2.3.0"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
log = "0.4.28"
mime = "0.3.17"
serde = "1.0.228"
serde-xml-rs = "0.8.1"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tower-http = { version = "0.6.6", features = ["fs"] }
uuid = "1.18.1"
virt = "0.4.3"
xml-rs = "0.8"

[dependencies.toml]
version = "0.9.8"
default-features = false
features = ["parse", "serde"]
